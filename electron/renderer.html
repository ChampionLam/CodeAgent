<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>desk-agent</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161a21;
        --panel-2: #1c2230;
        --border: #2a3141;
        --text: #e6e9ef;
        --muted: #8b93a7;
        --accent: #4c9aff;
        --reason: #b58cff;
        --ok: #3fb950;
        --warn: #d29922;
        --danger: #f85149;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px/1.55 "Segoe UI", -apple-system, system-ui, "Microsoft YaHei", sans-serif;
        background: var(--bg); color: var(--text);
        display: flex; flex-direction: column;
      }

      /* ---------------- top bar ---------------- */
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 14px; border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header .title { font-weight: 600; letter-spacing: .3px; }
      .badge {
        padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
        background: #2a3141; color: var(--muted);
      }
      .badge.ready { background: rgba(63,185,80,.15); color: var(--ok); }
      .badge.starting, .badge.restarting { background: rgba(210,153,34,.15); color: var(--warn); }
      .badge.crashed, .badge.version-mismatch { background: rgba(248,81,73,.15); color: var(--danger); }
      header .spacer { flex: 1; }
      header label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
      header .meta { color: var(--muted); font-size: 12px; }

      /* ---------------- transcript ---------------- */
      main { flex: 1; overflow-y: auto; padding: 16px 18px; }
      .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
      .empty code { background: var(--panel-2); padding: 2px 6px; border-radius: 5px; }

      .msg { margin: 0 0 16px; max-width: 900px; }
      .msg.user { margin-left: auto; }
      .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      .msg.user .bubble {
        background: var(--accent); color: #06101f; font-weight: 500;
        padding: 9px 12px; border-radius: var(--radius); white-space: pre-wrap; word-break: break-word;
      }
      .msg.assistant .body {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 10px 12px;
      }
      .content { white-space: pre-wrap; word-break: break-word; }
      .content:empty::after { content: "…"; color: var(--muted); }

      details.think { margin-bottom: 8px; border-left: 2px solid var(--reason); padding-left: 10px; }
      details.think > summary {
        cursor: pointer; color: var(--reason); font-size: 12px; list-style: none;
      }
      details.think > summary::-webkit-details-marker { display: none; }
      details.think .think-body { color: var(--muted); white-space: pre-wrap; margin-top: 6px; font-size: 13px; }

      .tool {
        margin: 8px 0; border: 1px solid var(--border); border-radius: 8px;
        background: var(--panel-2); overflow: hidden;
      }
      .tool > summary {
        cursor: pointer; padding: 7px 10px; display: flex; align-items: center; gap: 8px;
        font-size: 13px; list-style: none;
      }
      .tool > summary::-webkit-details-marker { display: none; }
      .tool .name { font-weight: 600; }
      .tool .lvl { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #2a3141; color: var(--muted); }
      .tool .lvl.L1 { color: var(--warn); }
      .tool .lvl.L2 { color: #e8912a; }
      .tool .lvl.L3 { color: var(--danger); }
      .tool .stat { margin-left: auto; font-size: 12px; color: var(--muted); }
      .tool .stat.ok { color: var(--ok); }
      .tool .stat.error, .tool .stat.denied { color: var(--danger); }
      .tool .stat.awaiting-approval { color: var(--warn); }
      .tool pre {
        margin: 0; padding: 8px 10px; border-top: 1px solid var(--border);
        background: #10141c; color: #c9d1d9; font-size: 12px; overflow-x: auto; white-space: pre-wrap;
      }

      .msg .err { color: var(--danger); font-size: 13px; margin-top: 6px; }
      .cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent);
                vertical-align: -2px; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* ---------------- composer ---------------- */
      footer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 14px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .chip {
        font-size: 12px; background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 999px; padding: 2px 10px; color: var(--muted);
        display: flex; align-items: center; gap: 6px;
      }
      .chip button { all: unset; cursor: pointer; color: var(--danger); }
      .compose { display: flex; gap: 8px; align-items: flex-end; }
      textarea {
        flex: 1; resize: none; min-height: 44px; max-height: 160px;
        background: var(--panel-2); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
        font: inherit;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      button.act {
        background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
        border-radius: 8px; padding: 10px 14px; font: inherit; cursor: pointer; white-space: nowrap;
      }
      button.act:hover { border-color: var(--accent); }
      button.act.primary { background: var(--accent); color: #06101f; border-color: var(--accent); font-weight: 600; }
      button.act.danger { color: var(--danger); }
      button.act[disabled] { opacity: .45; cursor: default; }
      .status-line { color: var(--muted); font-size: 12px; margin-top: 8px; min-height: 16px; }
      .status-line.error { color: var(--danger); }

      /* ---------------- approval dialog ---------------- */
      .overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,.6);
        display: flex; align-items: center; justify-content: center; z-index: 10;
      }
      .overlay[hidden] { display: none; }
      .dialog {
        width: min(680px, 92vw); background: var(--panel); border: 1px solid var(--border);
        border-radius: 12px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
      }
      .dialog.l3 { border: 2px solid var(--danger); box-shadow: 0 0 0 4px rgba(248,81,73,.15), 0 20px 60px rgba(0,0,0,.5); }
      .dialog h2 { margin: 0 0 4px; font-size: 16px; }
      .dialog .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
      .dialog .l3warn {
        background: rgba(248,81,73,.12); color: var(--danger); border: 1px solid rgba(248,81,73,.3);
        border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 12px;
      }
      .dialog pre {
        background: #10141c; color: #c9d1d9; border-radius: 8px; padding: 10px;
        font-size: 12px; max-height: 240px; overflow: auto; white-space: pre-wrap;
      }
      .dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
      .kv { display: flex; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
      .kv b { color: var(--text); font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <span class="title">desk-agent</span>
      <span id="state" class="badge">stopped</span>
      <span class="spacer"></span>
      <label><input id="useTools" type="checkbox" checked /> 允许模型使用工具</label>
      <span id="meta" class="meta"></span>
    </header>

    <main id="transcript">
      <div class="empty">
        还没开始。输入一句话试试，比如：<br />
        <code>读一下 workspace 里的文件，告诉我里面写了什么</code>
      </div>
    </main>

    <footer>
      <div id="chips" class="chips"></div>
      <div class="compose">
        <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="pick" class="act" type="button">图片</button>
        <button id="stop" class="act danger" type="button" disabled>停止</button>
        <button id="send" class="act primary" type="button">发送</button>
      </div>
      <div id="statusLine" class="status-line"></div>
    </footer>

    <div id="overlay" class="overlay" hidden>
      <div id="dialog" class="dialog">
        <h2 id="dlgTitle">请求执行工具</h2>
        <div id="dlgSub" class="sub"></div>
        <div id="dlgWarn" class="l3warn" hidden></div>
        <div class="kv"><span>级别</span><b id="dlgLevel"></b><span>·</span><span id="dlgReason"></span></div>
        <pre id="dlgArgs"></pre>
        <div class="row">
          <button id="dlgDeny" class="act danger" type="button">拒绝</button>
          <button id="dlgAlways" class="act" type="button">总是允许</button>
          <button id="dlgOnce" class="act primary" type="button">允许一次</button>
        </div>
      </div>
    </div>

    <script src="renderer.bundle.js"></script>
  </body>
</html>
